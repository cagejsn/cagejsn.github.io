<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">

		<title>Cage Johnson</title>

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="style.css?v=13">
	</head>
<body>
	<div id="app"></div>
	<script src="https://unpkg.com/vue@3.4.13"></script>
	<script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader/dist/vue3-sfc-loader.js"></script>
	<script>
		const { createApp } = Vue

		const options = {
			moduleCache: {
				vue: Vue
			},
			async getFile(url) {

				// Safari heuristically caches these .vue responses for months
				// because the dev server sends no Cache-Control header.
				const joiner = url.includes('?') ? '&' : '?'
				const res = await fetch(url + joiner + 'v=13', { cache: 'no-store' });
				if (!res.ok)
					throw Object.assign(new Error(res.statusText + ' ' + url), { res });
				return {
					getContentData: asBinary => asBinary ? res.arrayBuffer() : res.text(),
				}
			},
			addStyle(textContent) {

				const style = Object.assign(document.createElement('style'), { textContent });
				const ref = document.head.getElementsByTagName('style')[0] || null;
				document.head.insertBefore(style, ref);
			},

		}

		const { loadModule } = window['vue3-sfc-loader'];

		const app = createApp({
			components: {
				'personal-website': Vue.defineAsyncComponent(() => loadModule('./PersonalWebsite.vue', options))
			},
			template: '<personal-website> </personal-website>'
		});

		app.mount('#app');

	</script>
</body>

</html>
